entries:
  - id: "S001"
    state: "gap"
    fsd:
      doc: "kavita-fsd"
      section: "1"
      quote: "Each row on the Home screen can be collapsed, and Kavita remembers the choice on the next visit."
    page: null
    note: "Neither the dashboard nor the carousel rows have any collapse behaviour or remembered state."
  - id: "S002"
    state: "conflict"
    fsd:
      doc: "kavita-fsd"
      section: "1"
      quote: "The On Deck row shows up to 50 series."
    page: null
    note: "The On Deck row requests only the first 20 series."
  - id: "S003"
    state: "gap"
    fsd:
      doc: "kavita-fsd"
      section: "2.1"
      quote: "A Random button on the library screen opens a randomly chosen series from that library."
    page: null
    note: "The library screen has no Random button; only the name, actions menu, series count, filter and bulk operations."
  - id: "S004"
    state: "gap"
    fsd:
      doc: "kavita-fsd"
      section: "3.1"
      quote: "Users can keep a private note on a series that only they can see."
    page: null
    note: "The series screen has no private note feature (only an annotations tab)."
