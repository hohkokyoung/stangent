version: 4
entries:
  - id: "S001"
    state: "conflict"
    fsd:
      doc: "kavita-fsd"
      section: "9.2"
      quote: "When Prompt on Download is on, Kavita asks for confirmation before any download larger than 500 MB."
    page: null
    note: "The code asks for confirmation above 100 MB (SIZE_WARNING = 104857600), not 500 MB."
  - id: "S002"
    state: "conflict"
    fsd:
      doc: "kavita-fsd"
      section: "9.1"
      quote: "A new password must be at least 8 characters long."
    page: null
    note: "The identity setup requires a password of only 6 characters."
  - id: "S003"
    state: "conflict"
    fsd:
      doc: "kavita-fsd"
      section: "5"
      quote: "Kavita removes a series from Want to Read automatically as soon as the user finishes reading it."
    page: null
    note: "Removal is done by a cleanup task that removes completed, fully read series from Want to Read, not at the moment reading finishes."
  - id: "S004"
    state: "gap"
    fsd:
      doc: "kavita-fsd"
      section: "2.1"
      quote: "A Random button on the library screen opens a randomly chosen series from that library."
    page: null
    note: "No random-series button exists on the library screen or elsewhere in the UI templates."
  - id: "S005"
    state: "gap"
    fsd:
      doc: "kavita-fsd"
      section: "4.1"
      quote: "A slideshow mode turns the page automatically after a set number of seconds."
    page: null
    note: "No slideshow mode exists in the image reader."
  - id: "S006"
    state: "gap"
    fsd:
      doc: "kavita-fsd"
      section: "4.2"
      quote: "Selected text can be read aloud using the device's text-to-speech voice."
    page: null
    note: "The text selection overlay only offers Copy, Annotate and Bookmark; there is no read-aloud feature."
  - id: "S007"
    state: "gap"
    fsd:
      doc: "kavita-fsd"
      section: "6.2"
      quote: "The series in a collection can be exported to a CSV file."
    page: null
    note: "The collection detail screen has no CSV export action."
  - id: "S008"
    state: "gap"
    fsd:
      doc: "kavita-fsd"
      section: "7.2"
      quote: "The owner can share a reading list through a public link that opens without signing in."
    page: null
    note: "No public share link feature exists for reading lists."
  - id: "S009"
    state: "gap"
    fsd:
      doc: "kavita-fsd"
      section: "10.1"
      quote: "A maintenance mode switch blocks all non-admin users from signing in until it is turned off."
    page: null
    note: "There is no maintenance mode setting on the General page or in the server settings."
  - id: "S010"
    state: "gap"
    fsd:
      doc: "kavita-fsd"
      section: "10.2"
      quote: "An invite can be given an expiry date, after which its link stops working."
    page: null
    note: "The invite form has no expiry date option."
  - id: "S011"
    state: "undocumented"
    fsd: null
    page:
