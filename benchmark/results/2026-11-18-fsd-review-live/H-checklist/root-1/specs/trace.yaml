  - id: "S001"
    state: "conflict"
    fsd:
      doc: "kavita-fsd"
      section: "9.1"
      quote: "A new password must be at least 8 characters long."
    page: null
    note: "The server requires a password of at least 6 characters, not 8."
  - id: "S002"
    state: "gap"
    fsd:
      doc: "kavita-fsd"
      section: "2.1"
      quote: "A Random button on the library screen opens a randomly chosen series from that library."
    page: null
    note: "No Random button exists on the library screen or anywhere in the web templates."
  - id: "S003"
    state: "gap"
    fsd:
      doc: "kavita-fsd"
      section: "10.1"
      quote: "A maintenance mode switch blocks all non-admin users from signing in until it is turned off."
    page: null
    note: "The General settings page has no maintenance mode switch."
  - id: "S004"
    state: "gap"
    fsd:
      doc: "kavita-fsd"
      section: "10.2"
      quote: "An invite can be given an expiry date, after which its link stops working."
    page: null
    note: "The invite form has no expiry date option."
