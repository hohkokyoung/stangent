version: 4
entries:
  - id: "S001"
    state: "gap"
    fsd:
      doc: "sonarr-fsd"
      section: "1.1"
      quote: "Up to 10 series can be selected from the search results and added together in one step."
    page: null
    note: "The Add New search results have no multi-select; each result is added individually through its own modal."
  - id: "S002"
    state: "gap"
    fsd:
      doc: "sonarr-fsd"
      section: "1.2"
      quote: "The episode list of a series can be exported as a CSV file."
    page: null
    note: "No CSV export exists in the frontend."
  - id: "S003"
    state: "conflict"
    fsd:
      doc: "sonarr-fsd"
      section: "1.2"
      quote: "Deleting a series always deletes its folder and all its files from disk."
    page: null
    note: "The delete modal has a Delete Files option that defaults to off (plus add-import-list-exclusion), so files are only deleted if chosen."
  - id: "S004"
    state: "gap"
    fsd:
      doc: "sonarr-fsd"
      section: "2"
      quote: "Episodes can be dragged to another day to change their air date."
    page: null
    note: "The calendar has no drag and drop of episodes."
  - id: "S005"
    state: "conflict"
    fsd:
      doc: "sonarr-fsd"
      section: "2"
      quote: "Sonarr can share the calendar as an iCal feed, which covers the previous 14 days and the next 60 days."
    page: null
    note: "The feed defaults to the previous 7 days and next 28 days (pastDays/futureDays query parameters)."
  - id: "S006"
    state: "conflict"
    fsd:
      doc: "sonarr-fsd"
      section: "3.1"
      quote: "Removing an item from the queue always adds the release to the blocklist."
    page: null
    note: "The remove dialog offers Do Not Blocklist, Blocklist and Search, or Blocklist Only."
  - id: "S007"
    state: "gap"
    fsd:
      doc: "sonarr-fsd"
      section: "3.1"
      quote: "Each queue item has a priority (High, Normal or Low) that the user can change to reorder the downloads."
    page: null
    note: "The queue has no user-changeable priority; the priority props in Queue.tsx are only column layout priorities."
  - id: "S008"
    state: "gap"
    fsd:
      doc: "sonarr-fsd"
      section: "3.2"
      quote: "Any history entry can be undone, which restores the episode file that an upgrade replaced."
    page: null
    note: "History only offers Mark as Failed on grabbed items; there is no undo restoring replaced files."
  - id: "S009"
    state: "gap"
    fsd:
      doc: "sonarr-fsd"
      section: "Wanted / Missing episodes"
      quote: "Search All starts straight away, without asking the user to confirm."
    page: null
    note: "Search All opens a confirmation modal first."
  - id: "S010"
    state: "gap"
    fsd:
      doc: "sonarr-fsd"
      section: "Wanted / Missing episodes"
      quote: "A weekly email digest lists every missing episode."
    page: null
    note: "No email digest feature exists in the code."
  - id: "S011"
    state: "conflict"
    fsd:
      doc: "sonarr-fsd"
      section: "Settings / Tags"
      quote: "Tag labels may contain letters, numbers, spaces and underscores."
    page: null
    note: "The validator allows only a-z, 0-9 and hyphen; no spaces or underscores."
  - id: "S012"
    state: "gap"
    fsd:
      doc: "sonarr-fsd"
      section: "Settings / Tags"
      quote: "Each tag has a colour, chosen from a palette of 12 colours, which is shown wherever the tag appears."
    page: null
    note: "Tags have only a label; there is no colour field."
  - id: "S013"
    state: "conflict"
    fsd:
      doc: "sonarr-fsd"
      section: "Settings / Profiles / Delay profiles"
      quote: "The default delay profile can be given tags like any other."
    page: null
    note: "The default profile (Id 1) must have no tags; the validator enforces an empty collection and the UI shows 'applies to all series'."
  - id: "S014"
    state: "gap"
    fsd:
      doc: "sonarr-fsd"
      section: "Settings / Quality definitions"
      quote: "Each quality can be limited to a maximum episode runtime."
    page: null
    note: "No runtime limit exists on quality definitions; only min, preferred and max size."
  - id: "S015"
    state: "conflict"
    fsd:
      doc: "sonarr-fsd"
      section: "Settings / General / Logging"
      quote: "Each log file can grow up to 50 megabytes before a new one is started."
    page: null
    note: "Log size limit is validated between 1 and 10 MB."
  - id: "S016"
    state: "conflict"
    fsd:
      doc: "sonarr-fsd"
      section: "Settings / General / Backups"
      quote: "Interval: how often an automatic backup is taken, from 1 to 30 days."
    page: null
    note: "Backup interval is validated between 1 and 7 days."
  - id: "S017"
    state: "conflict"
    fsd:
      doc: "sonarr-fsd"
      section: "Settings / General / Backups"
      quote: "Retention: how long backups are kept, up to 365 days."
    page: null
    note: "Backup retention is validated between 1 and 90 days."
  - id: "S018"
    state: "gap"
    fsd:
      doc: "sonarr-fsd"
      section: "Settings / Interface"
      quote: "The font size can be set to small, medium or large."
    page: null
    note: "The UI settings screen has no font size option."
  - id: "S019"
    state: "gap"
    fsd:
      doc: "sonarr-fsd"
      section: "System / Backups"
      quote: "Backups can be copied automatically to an S3 bucket."
    page: null
    note: "No S3 backup support exists."
