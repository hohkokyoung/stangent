version: 4
entries:
  - id: "S001"
    state: "gap"
    fsd:
      doc: "kavita-fsd"
      section: "2.1"
      quote: "A Random button on the library screen opens a randomly chosen series from that library."
    page: null
    note: "The library detail screen has no Random button; the only random behaviour is the dashboard's random-genre row."
  - id: "S002"
    state: "gap"
    fsd:
      doc: "kavita-fsd"
      section: "1"
      quote: "Each row on the Home screen can be collapsed, and Kavita remembers the choice on the next visit."
    page: null
    note: "No collapse feature exists on the dashboard or its carousels."
  - id: "S003"
    state: "conflict"
    fsd:
      doc: "kavita-fsd"
      section: "5"
      quote: "Kavita removes a series from Want to Read automatically as soon as the user finishes reading it."
    page: null
    note: "Removal is done by a scheduled recurring cleanup job (CleanupWantToRead), not immediately on finishing."
  - id: "S004"
    state: "gap"
    fsd:
      doc: "kavita-fsd"
      section: "6.2"
      quote: "The series in a collection can be exported to a CSV file."
    page: null
    note: "No CSV export exists in the collection screens."
  - id: "S005"
    state: "gap"
    fsd:
      doc: "kavita-fsd"
      section: "7.2"
      quote: "The owner can share a reading list through a public link that opens without signing in."
    page: null
    note: "No public sharing link feature for reading lists exists in the code."
  - id: "S006"
    state: "conflict"
    fsd:
      doc: "kavita-fsd"
      section: "7.2"
      quote: "A filter box for finding items appears once a list has more than 25 items."
    page: null
    note: "The filter box appears when the list has more than 10 items."
  - id: "S007"
    state: "conflict"
    fsd:
      doc: "kavita-fsd"
      section: "9.1"
      quote: "A new password must be at least 8 characters long."
    page: null
    note: "The minimum password length is 6."
  - id: "S008"
    state: "gap"
    fsd:
      doc: "kavita-fsd"
      section: "9.1"
      quote: "Users can turn on two-factor sign-in with an authenticator app."
    page: null
    note: "No two-factor authentication exists in the frontend."
  - id: "S009"
    state: "conflict"
    fsd:
      doc: "kavita-fsd"
      section: "9.2"
      quote: "When Prompt on Download is on, Kavita asks for confirmation before any download larger than 500 MB."
    page: null
    note: "The size threshold is 100 MB (104857600 bytes), not 500 MB."
  - id: "S010"
    state: "conflict"
    fsd:
      doc: "kavita-fsd"
      section: "4.1"
      quote: "Brightness can be set anywhere from 0% to 100%."
    page: null
    note: "Brightness (darkness) is validated between 10 and 100."
  - id: "S011"
    state: "gap"
    fsd:
      doc: "kavita-fsd"
      section: "4.1"
      quote: "A slideshow mode turns the page automatically after a set number of seconds."
    page: null
    note: "The image reader has no slideshow mode."
  - id: "S012"
    state: "conflict"
    fsd:
      doc: "kavita-fsd"
      section: "4.2"
      quote: "Font size can be set from 50% to 200%."
    page: null
    note: "Font size is validated from 50 to 300."
  - id: "S013"
    state: "conflict"
    fsd:
      doc: "kavita-fsd"
      section: "10.1"
      quote: "Changes on this page are stored only when the administrator presses Save."
    page: null
    note: "General settings autosave (debounced 300ms) whenever the form is valid; there is no Save button."
  - id: "S014"
    state: "gap"
    fsd:
      doc: "kavita-fsd"
      section: "10.1"
      quote: "A maintenance mode switch blocks all non-admin users from signing in until it is turned off."
    page: null
    note: "No maintenance mode setting exists in the code."
  - id: "S015"
    state: "gap"
    fsd:
      doc: "kavita-fsd"
      section: "10.2"
      quote: "An invite can be given an expiry date, after which its link stops working."
    page: null
    note: "The invite form has no expiry date option."
  - id: "S016"
    state: "conflict"
    fsd:
      doc: "kavita-fsd"
      section: "10.3"
      quote: "Manage Collections is turned on by default for a new library."
    page: null
    note: "Manage Collections defaults to off (false) for a new library."
  - id: "S017"
    state: "undocumented"
    fsd: null
    page:
      id: "page:/browse/genres"
      quote: "A Browse Genres screen exists but the FSD only describes People and Tags."
    note: "A Browse Genres screen exists but the FSD only describes People and Tags."
  - id: "S018"
    state: "undocumented"
    fsd: null
    page:
      id: "page:/browse/annotations"
      quote: "An All Annotations browse screen exists that the FSD does not describe."
    note: "An All Annotations browse screen exists that the FSD does not describe."
  - id: "S019"
    state: "undocumented"
    fsd: null
    page:
      id: "page:/all-filters"
      quote: "An All Filters screen (smart filters list) exists that the FSD does not describe."
    note: "An All Filters screen (smart filters list) exists that the FSD does not describe."
  - id: "S020"
    state: "undocumented"
    fsd:
      doc: "kavita-fsd"
      section: "9.2"
      quote: ""
    page: null
    note: "Preferences also has Share Profile and Include Unknowns (social max age rating) switches that the FSD does not mention."
