version: 4
entries:
  - id: "S001"
    state: "conflict"
    fsd:
      doc: "kavita-fsd"
      section: "9.1"
      quote: "A new password must be at least 8 characters long."
    page: null
    note: "The minimum password length is 6 characters, set both on the server and in the client forms."
  - id: "S002"
    state: "conflict"
    fsd:
      doc: "kavita-fsd"
      section: "9.2"
      quote: "When Prompt on Download is on, Kavita asks for confirmation before any download larger than 500 MB."
    page: null
    note: "The download confirmation threshold is 100 MB (SIZE_WARNING = 104,857,600 bytes), not 500 MB."
  - id: "S003"
    state: "match"
    fsd:
      doc: "kavita-fsd"
      section: "10.1"
      quote: "Days of Backups and Days of Logs each accept a value from 1 to 30 and both default to 30."
    page: null
    note: "Backups and logs are validated to a range of 1 to 30. I did not check the default of 30."
  - id: "S004"
    state: "match"
    fsd:
      doc: "kavita-fsd"
      section: "10.1"
      quote: "Cache Size must be at least 50 MB"
    page: null
    note: "Cache size has a minimum of 50."
