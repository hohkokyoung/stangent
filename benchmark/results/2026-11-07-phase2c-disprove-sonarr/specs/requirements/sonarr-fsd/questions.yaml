# Questions for the BA (D99): ambiguities and clashes in the FSD, never resolved by the AI.
version: 1
questions:
  - id: "Q-0001"
    section: "3.2"
    text: "What does undoing a history entry do when the entry is not an upgrade (e.g. grabbed, deleted, renamed or failed), given that only the restoring of an upgraded file is described?"
    quotes:
      - doc: "sonarr-fsd"
        section: "3.2"
        text: "Any history entry can be undone, which restores the episode file that an upgrade replaced."
        hash: "5750091a578935b5e642243d2d4200279213effd6a4f5c6c1aab63ef9fba03d8"
    status: "open"
    answer: null
  - id: "Q-0002"
    section: "1.1"
    text: "What happens when the user selects more than 10 series: is the selection blocked or is an error shown?"
    quotes:
      - doc: "sonarr-fsd"
        section: "1.1"
        text: "Up to 10 series can be selected from the search results and added together in one step."
        hash: "6e0a78cdc2f62083146d71489b6d63837e25c450265fc89520037de0a9754ca6"
    status: "open"
    answer: null
  - id: "Q-0003"
    section: "Wanted / Missing episodes"
    text: "The missing screen lists only monitored episodes, yet the user can toggle to unmonitored missing episodes; which is the default view, and does the first sentence apply only to the default?"
    quotes:
      - doc: "sonarr-fsd"
        section: "Wanted / Missing episodes"
        text: "The missing screen lists monitored episodes that have aired but have no file on disk."
        hash: "7fdf420cc047b4c149da08c7cb0e007c5f8fb68fc2c17d75b0db0580990ea96c"
      - doc: "sonarr-fsd"
        section: "Wanted / Missing episodes"
        text: "The user can toggle between monitored and unmonitored missing episodes."
        hash: "78f716187ae0383f6089dc65a6097fccf25d55a6bafa71b91b2d3f2cc91f213c"
    status: "open"
    answer: null
