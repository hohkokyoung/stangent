# nopCommerce's areas, confirmed by the owner on 2026-11-13 (D267): a fresh proposal from commit 77d112f365 (the first was older than
# step 6's flows) with the owner's answers to its 10 ties: flyout cart, order summary and PunchOut cart forms -> Shopping cart;
# private message forms -> Inbox; search box -> Search; topic block -> Nop.Web › Topic; customer cache handler -> Admin › Customers;
# PayPal handler -> Admin › System; Facebook Pixel handler -> Nop.Web › Catalog. Names and backend-folder areas as proposed.
# Areas proposed by `stangent areas propose` (D218–D228) from commit 77d112f365e210ebdfa2f9790c8202a0e3b1c74e.
# Copy to specs/areas.yaml and confirm it there: rename an area (`name`), merge two by listing both sources under one name,
# split one by giving a menu address or a deeper folder its own area, and answer each tie with one of its `choose`.
