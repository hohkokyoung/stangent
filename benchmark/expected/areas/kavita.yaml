# Kavita's areas, confirmed by the owner on 2026-11-13 (D267): the proposal from commit 2d225367f0 with the owner's answers to its
# 32 ties, by group: the shared edit dialogs by what each edits (series, match, relation, cover -> series-detail; chapter -> chapter-detail;
# volume -> volume-detail; collection -> Collections; library settings and folder picker -> Customize; smart filter -> all-filters);
# entity cards -> library-detail; filter Save -> All Series (all-filters wasn't a choice); reviews -> series-detail; Want to Read
# toggle -> Want To Read; Browse People filter -> Browse People; manage smart filters -> Customize. Names as proposed.
# Areas proposed by `stangent areas propose` (D218–D228) from commit 2d225367f0310ac7354423b772a4c6a7caf63fd2.
# Copy to specs/areas.yaml and confirm it there: rename an area (`name`), merge two by listing both sources under one name,
# split one by giving a menu address or a deeper folder its own area, and answer each tie with one of its `choose`.
# The deepest match wins; new flows land by themselves. `stangent areas check` reads specs/areas.yaml.
