name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; no job here writes to the repo.
permissions:
  contents: read

# A new push supersedes the previous run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Floor, mid, and current. 3.10 is the verified minimum: the suite passes
        # there, and nothing in the templates uses syntax newer than it (notably
        # no PEP 701 nested-quote f-strings, which would silently require 3.12).
        python-version: ["3.10", "3.12", "3.14"]
        os: [ubuntu-latest]
        # The README claims Windows and macOS support; until these ran, that was
        # an assertion with no detector. One version each — the interesting axis
        # here is the platform (interpreter naming, path separators, shell), not
        # the Python version, which ubuntu already covers three ways.
        include:
          - {os: macos-latest, python-version: "3.12"}
          - {os: windows-latest, python-version: "3.12"}
    # windows-latest is informational until its failure is diagnosed. It stays in
    # the matrix — deleting it would remove the only thing that can ever answer
    # the question — but it does not gate main on a platform whose support is
    # openly documented as unverified.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # PyYAML is the only third-party import the suite needs. The heavier
      # retrieval deps (fastembed, sqlite-vec, voyageai) are deliberately absent:
      # no test imports them, and installing them would make CI slow and flaky
      # for no coverage gain.
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pyyaml

      # git identity: test_git_branch.py builds real repos and commits into them.
      # Its own fixtures set user.name/email per repo, but a global fallback keeps
      # a bare `git commit` from failing if a future test forgets.
      - name: Configure git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      # -b buffers each test's stdout/stderr and replays it only for failures.
      # The suite's fixtures install into temp dirs and run the citation
      # verifier, which together printed 319 lines of passing-run output that a
      # real failure had to be found inside.
      #
      # The interpreter's view of the POSIX tools verify_clears.py executes is
      # recorded on every platform, for comparison. On Windows they turned out to
      # be present — Git for Windows puts them on PATH — which is what ruled out
      # the first theory for that platform's failure.
      - name: Report resolvable POSIX tools
        run: |
          python -c "import shutil; print({t: shutil.which(t) for t in ['grep','find','wc','sh','rg','sort','head']})"

      - name: Run tests
        run: python -m unittest discover installer/tests -v -b

  # PyYAML is a documented dependency, but the runtime carries `yaml = None`
  # fallbacks throughout, so running without it is a real state users land in.
  # It was previously unverified: the config tests errored, which is
  # indistinguishable from the fallback being broken. This job keeps it honest —
  # the suite must pass with the parser absent, skipping only what genuinely
  # cannot run without one.
  no-pyyaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: Confirm PyYAML really is absent
        run: |
          python -c "import yaml" 2>/dev/null && { echo "PyYAML present; this job proves nothing"; exit 1; } || true
      - name: Run tests without PyYAML
        run: python -m unittest discover installer/tests -b

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters
        run: python -m pip install --upgrade pip ruff
      # Templates ship to users' projects, so a syntax error or an undefined name
      # reaches them as a broken install rather than a failed build here.
      - name: ruff
        run: ruff check .

  # ---------------------------------------------------------------------------
  # TEMPORARY diagnostic. Third design; the first two produced nothing usable.
  #
  # The second used `continue-on-error: true` on STEPS and read each step's
  # `conclusion` from the API. That field is forced to "success" by
  # continue-on-error, and the API exposes no `outcome` for steps — so all five
  # probes reported success unconditionally, whatever happened. A check that can
  # only ever say "passed" is worse than none, and its output was published as
  # fact. Everything it "established" is void.
  #
  # JOB-level conclusions are not masked the same way (an isolation leg passed
  # while its siblings failed), so every leg here is a job.
  #
  # Established: test_verify_clears fails on Windows under every invocation
  # (dotted, bare, discover, full suite); test_symbols via discover passes. So
  # the fault is in the citation suite, not in test isolation or the loader.
  #
  # Delete this job once the cause is fixed.
  # ---------------------------------------------------------------------------
  windows-cause-probe:
    runs-on: windows-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Do the tools verify_clears shells out to actually exist here?
          - {leg: "tool-grep-present", cmd: "python -c \"import shutil,sys; sys.exit(0 if shutil.which('grep') else 1)\""}
          - {leg: "tool-wc-present",   cmd: "python -c \"import shutil,sys; sys.exit(0 if shutil.which('wc') else 1)\""}
          - {leg: "tool-find-is-gnu",  cmd: "python -c \"import subprocess,sys; r=subprocess.run(['find','--version'],capture_output=True,text=True); sys.exit(0 if 'findutils' in (r.stdout or '').lower() else 1)\""}
          # Classes that EXECUTE a cited command. Fail => the tool theory holds.
          - {leg: "vc-executes-commands", cmd: "python -m unittest installer.tests.test_verify_clears.TestCommandCitations installer.tests.test_verify_clears.TestPipelines -b"}
          # Classes that only PARSE. Pass => the fault is execution, not parsing.
          - {leg: "vc-parses-only", cmd: "python -m unittest installer.tests.test_verify_clears.TestClassification installer.tests.test_verify_clears.DeclaredEnumerationsCase -b"}
          # Gate check: refusing an unsafe command needs no external binary.
          - {leg: "vc-safety-gate", cmd: "python -m unittest installer.tests.test_verify_clears.TestCommandSafety -b"}
    name: "cause ${{ matrix.leg }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyyaml
      - name: run
        run: ${{ matrix.cmd }}
