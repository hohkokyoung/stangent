# stangent's spec workflow for a repo that uses it (D55, D58). Thin on purpose (D24): every step is a stangent
# command, so moving to another CI means rewriting this file, not logic. Copy it to .github/workflows/spec.yml.
#
# - On a PR (code only, no AI): list the reference pages it makes stale as a PR comment; check specs/trace.yaml.
# - On merge to main (AI, unless ai.enabled is false): regenerate the stale pages with headless Claude Code, fill
#   decided_by for decisions the merged PR made, and open a spec-only PR from the bot (D12), merged by a person.
# Secrets: CLAUDE_CODE_OAUTH_TOKEN (headless Claude Code, D60). The bot needs contents and pull-requests: write.
name: stangent-spec
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, filter: "blob:limit=200k" }     # the graph's 📜 history needs it (D42)
      - uses: actions/setup-dotnet@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: dotnet tool install --global stangent
      - run: stangent graph build
      - run: stangent spec stale --diff "origin/${{ github.base_ref }}..HEAD" --format md > stale.md
        if: ${{ !startsWith(github.head_ref, 'stangent/spec-') }}
      - if: ${{ !startsWith(github.head_ref, 'stangent/spec-') }}
        run: gh pr comment "${{ github.event.number }}" --body-file stale.md --edit-last || gh pr comment "${{ github.event.number }}" --body-file stale.md
        env: { GH_TOKEN: "${{ github.token }}" }
      # decided_by may change only in the bot's own spec PRs, where the merge job filled it from the code host.
      - run: stangent trace check ${{ !startsWith(github.head_ref, 'stangent/spec-') && format('--base origin/{0}', github.base_ref) || '' }}

  merge:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, filter: "blob:limit=200k" }
      - uses: actions/setup-dotnet@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - uses: actions/checkout@v7                               # the plugin: subagents and the batch driver
        with: { repository: hohkokyoung/stangent, path: .stangent-src, sparse-checkout: plugin }
      - run: dotnet tool install --global stangent && npm install --global @anthropic-ai/claude-code
      - run: stangent graph build
      # decided_by comes from the code host, never typed (D58): whoever merged the PR this push came from.
      - run: |
          by="$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].merged_by.login // empty')"
          [ -z "$by" ] || stangent trace attribute --base HEAD~1 --by "$by"
        env: { GH_TOKEN: "${{ github.token }}" }
      # Exit code 4 means AI is off for this repo (D24): the stale list on PRs is all that runs.
      - run: |
          [ "$(stangent status | jq -r '.result.ai.enabled')" = true ] || exit 0
          .stangent-src/plugin/scripts/spec-run.sh --jobs 4 --stale | tee regenerated.tsv
        env: { CLAUDE_CODE_OAUTH_TOKEN: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" }
      # Regenerated statements can move quotes: decisions whose quotes no longer match drop back to undecided (D58).
      - run: stangent trace check --fix || true
      - run: |
          [ -n "$(git status --porcelain -- specs)" ] || exit 0
          branch="stangent/spec-${GITHUB_SHA::7}"
          git switch -c "$branch"
          git add specs/reference specs/trace.yaml specs/trace-runs.json
          git -c user.name="stangent[bot]" -c user.email="stangent-bot@users.noreply.github.com" commit -qm "spec: regenerate stale reference pages after ${GITHUB_SHA::7}"
          git push -u origin "$branch"
          { echo "Regenerated by stangent after ${GITHUB_SHA::7} (D55). Review like any spec change, then merge."; echo; echo '```'; cat regenerated.tsv 2>/dev/null; echo '```'; } > body.md
          gh pr create --title "spec: reference pages after ${GITHUB_SHA::7}" --body-file body.md --head "$branch"
        env: { GH_TOKEN: "${{ github.token }}" }
